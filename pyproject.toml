# Python exists in this repository for documentation and nothing else.
# The product is a macOS application built with SwiftPM; see BRIEF.md.
[project]
name = "swiftstar-docs"
version = "0.1.0"
description = "Documentation build for SwiftStar, a macOS app for running a local model on Apple silicon"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    # myst_enable_extensions includes "linkify"; the strict build fails without this.
    "linkify-it-py>=2.0.3",
    "sphinx-autobuild>=2025.8.25",
]
dev = [
    # P24.3: the `lint` tool's host command. The agent's lint rung runs
    # `uv run ruff check --output-format=json`; without a ruff target in the
    # workspace the tool refuses deterministically.
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs/_build"]
